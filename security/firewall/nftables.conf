#!/usr/sbin/nft -f
#
# Boswas OS v1 baseline host firewall.
# Installed as /etc/boswas/firewall/nftables.conf by boswas-security and loaded
# by nftables.service through a Boswas drop-in (the Debian-owned
# /etc/nftables.conf is left untouched).
#
# Model: a workstation, not a router.
#   inbound   - default drop; only replies to our own traffic, loopback and
#               the ICMP/ICMPv6 messages IP needs to work
#   forward   - default drop
#   outbound  - allowed (egress control belongs to the network / control plane)
#
# Only the Boswas table is replaced on reload, so rules owned by other tools
# (libvirt, container runtimes) are not flushed.
#
# Local additions: drop *.nft files with plain rule statements into
#   /etc/boswas/firewall/input.d/    (evaluated before the final drop)
#   /etc/boswas/firewall/forward.d/
# e.g.  tcp dport 22 ip saddr 10.20.0.0/16 accept comment "provisioned SSH"

table inet boswas_filter
delete table inet boswas_filter

table inet boswas_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state { established, related } accept
		iif "lo" accept

		# ICMPv6 required for IPv6 to function (RFC 4890), incl. neighbour discovery.
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept
		# ICMPv4 error reporting (path MTU discovery etc.) and rate-limited ping.
		meta l4proto icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto icmp icmp type echo-request limit rate 5/second accept
		meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 5/second accept

		# DHCPv6 replies arrive from a link-local server to the client port.
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		include "/etc/boswas/firewall/input.d/*.nft"

		# Rate-limited record of dropped inbound connection attempts (kernel log /
		# journal). Packet headers only - no payload is logged.
		limit rate 10/minute burst 20 packets log prefix "boswas-fw drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		include "/etc/boswas/firewall/forward.d/*.nft"
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
