# Boswas OS: load the Boswas baseline ruleset instead of Debian's
# /etc/nftables.conf (which belongs to the nftables package and is not edited).
# Installed by boswas-security as
#   /usr/lib/systemd/system/nftables.service.d/boswas.conf
[Unit]
Documentation=file:///usr/share/doc/boswas-security/README.md

[Service]
ExecStart=
ExecStart=/usr/sbin/nft -f /etc/boswas/firewall/nftables.conf
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/boswas/firewall/nftables.conf
