# Boswas OS v1 journal policy (installed by boswas-security into
# /usr/lib/systemd/journald.conf.d/). The journal is the primary local log.
# Retention is bounded on purpose: logs are an operational and security record,
# not a long-term archive of employee activity (docs/security/privacy.md).
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
MaxRetentionSec=90day
