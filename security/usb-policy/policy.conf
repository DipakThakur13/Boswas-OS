# Boswas OS USB / removable-media policy (installed as
# /etc/boswas/usb-policy/policy.conf by boswas-security).
#
# v1 alpha ships the policy FRAMEWORK only: this file is read and reported by
# `boswas security status`, but no enforcement is installed yet. Enforcement
# (udev authorization of USB mass-storage interfaces, udisks2 polkit rules)
# is planned for the Phase 3 security milestone. See README.md next to this
# file in the source tree.
#
# MODE:
#   allow          - removable storage allowed (v1 alpha default)
#   audit          - allowed, every attach/mount recorded        (planned)
#   read-only      - mounted read-only for standard users        (planned)
#   block-storage  - USB mass storage blocked; HID, audio, etc.
#                    unaffected                                   (planned)
MODE="allow"
