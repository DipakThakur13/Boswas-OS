# Boswas OS v1 kernel hardening (installed by boswas-security into
# /usr/lib/sysctl.d/). Override locally in /etc/sysctl.d/ if a profile needs to.
#
# Debian's hardening-runtime package was evaluated and not used: it sets
# user.max_user_namespaces=0 (breaks Flatpak/bubblewrap and browser sandboxes)
# and adds nosmt/slub_debug to the kernel command line. See
# docs/architecture/decisions.md (ADR-0006).
#
# Deliberately NOT set: kernel.unprivileged_userns_clone / user.max_user_namespaces.
# Unprivileged user namespaces are required by bubblewrap (Flatpak) and the
# Firefox content sandbox.

# Hide kernel pointers and the kernel log from unprivileged users.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# eBPF: no unprivileged use, harden the JIT.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Processes may only ptrace their own descendants (root is unaffected).
kernel.yama.ptrace_scope = 1

# No replacing the running kernel via kexec.
kernel.kexec_load_disabled = 1

# perf events: privileged users only (Debian default, stated explicitly).
kernel.perf_event_paranoid = 3

# Magic SysRq: only sync (16), remount read-only (32) and reboot (128).
kernel.sysrq = 176

# Filesystem link/FIFO protections and no core dumps from setuid programs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# Do not autoload TTY line disciplines (historic exploit vector).
dev.tty.ldisc_autoload = 0

# Network: a workstation never routes or honours ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
