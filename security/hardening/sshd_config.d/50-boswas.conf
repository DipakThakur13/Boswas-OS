# Boswas OS v1 SSH server policy.
#
# openssh-server is NOT installed by default. This file only takes effect if
# SSH is explicitly provisioned on a device, and makes that provisioning safe
# by default: key-based logins for named users only.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
X11Forwarding no
