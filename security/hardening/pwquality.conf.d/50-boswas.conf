# Boswas OS v1 local password quality policy (libpwquality, used by
# pam_pwquality on password changes). Length over complexity, in line with
# NIST SP 800-63B. Applies to local accounts; Boswas ID (SSO) accounts will be
# governed by the identity provider in a later phase.

minlen = 12
minclass = 2
maxrepeat = 3
dictcheck = 1
usercheck = 1
enforce_for_root
