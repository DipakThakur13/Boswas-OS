# Boswas OS compositor configuration for the login screen.
#
# Installed as /usr/share/boswas/compositor/greeter.toml and used by
# boswas-greeter. The only program on this compositor is the greeter.

[pointer]
cursor_theme = "Boswas-Cursors"

[lock]
# Nobody is logged in: there is no session to lock.
idle_seconds = 0
command = []

[shell]
command = ["/usr/libexec/boswas/boswas-shell", "--greeter"]

[xwayland]
# No X server: the greeter is a Wayland program and nothing else runs here.
enabled = false

[apps]
terminal = []
files = []
settings = []
task_manager = []

[power]
screen_off_seconds = 300

[policy]
lock_idle_max_seconds = 0
privileged_protocols = "shell"
