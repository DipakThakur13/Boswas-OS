# Boswas OS compositor defaults.
#
# Installed as /usr/share/boswas/compositor/compositor.toml. Do not edit
# this file: an administrator overrides values in /etc/boswas/compositor.toml
# and a user in ~/.config/boswas/compositor.toml. boswas-compositor(1)
# describes every key.

[keyboard]
layout = "us"
repeat_delay = 400
repeat_rate = 30
# Accessibility: modifiers that stay pressed for the next key, and keys
# that count only when held (slow keys) or are ignored when repeated too
# soon (bounce keys). Times in milliseconds.
sticky_keys = false
sticky_keys_lock = true
filter_keys = false
slow_keys_ms = 0
bounce_keys_ms = 500

[pointer]
# Mice and trackballs.
natural_scroll = false
accel_speed = 0.0
accel_profile = "adaptive"
left_handed = false
cursor_theme = "Boswas-Cursors"
cursor_size = 24

[touchpad]
tap_to_click = true
natural_scroll = true
accel_speed = 0.0
disable_while_typing = true
# Three fingers sideways: the next desktop. Three fingers up: Task View.
gestures = true

[output]
scale = 1.0

[lock]
# The session locks after ten minutes without input.
idle_seconds = 600
command = ["/usr/libexec/boswas/boswas-shell", "--lock"]

[shell]
command = ["/usr/libexec/boswas/boswas-shell"]

[apps]
terminal = ["boswas-terminal"]
files = ["boswas-files"]
settings = ["boswas-control-center"]
task_manager = ["boswas-task-manager"]

[night_light]
enabled = false
temperature = 4500
scheduled = false
from = "20:00"
to = "06:00"

[power]
# The screens turn off after five minutes without input.
screen_off_seconds = 300

[appearance]
scheme = "dark"
accent = "iris"
transparency = true

[accessibility]
# Text size in percent (100 to 225); nothing else grows.
text_scale = 100
always_show_scrollbars = false

[color_filter]
# grayscale, inverted, grayscale_inverted, deuteranopia, protanopia or
# tritanopia; Super+Ctrl+C toggles it when shortcut is true.
enabled = false
filter = "grayscale"
shortcut = false

[magnifier]
# Super+Plus and Super+Minus zoom by step percent, Super+Esc ends it.
enabled = false
zoom = 200
step = 100

[taskbar]
alignment = "center"
auto_hide = false
task_view = true
clock_seconds = false
badges = true

[start]
layout = "default"
recently_added = true
most_used = true
folders = ["settings", "files"]

[multitasking]
snap_windows = true
snap_layouts_on_maximize = true
snap_layouts_on_drag = true
# "desktop": only the windows of the current desktop; "all": of every one.
taskbar_windows = "desktop"
alt_tab_windows = "desktop"

[notifications]
do_not_disturb = false
do_not_disturb_scheduled = false
do_not_disturb_from = "22:00"
do_not_disturb_to = "07:00"
banners_off = []
toast_seconds = 5

[policy]
# Users may shorten the lock timeout but not lengthen or disable it.
lock_idle_max_seconds = 600
# Panels, the lock screen, the window list and clipboard control are
# offered only to the programs the compositor starts itself.
privileged_protocols = "shell"
