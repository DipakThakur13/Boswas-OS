[package]
name = "boswas-shell"
description = "The Boswas OS shell: panel, launcher, lock screen and login greeter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
boswas-ui = { workspace = true, features = ["text", "icons", "images"] }
boswas-services.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Clipboard control (zwlr_data_control_v1), which the compositor offers to
# the programs it starts itself: the clipboard history.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1"
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
