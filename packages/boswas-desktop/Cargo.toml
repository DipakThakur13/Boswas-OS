# Boswas Desktop: the native Boswas OS desktop session.
#
#   boswas-ui          design tokens (desktop/ui/tokens.json), software drawing, text
#   boswas-compositor  the Wayland compositor: display server, window manager, effects
#   boswas-services    what the shell shows and controls: notifications, tray,
#                      network, Bluetooth, audio, power, session, authentication
#   boswas-services-bridge  the same backends for the Settings application
#                      (JSON lines on standard input and output)
#   boswas-shell       taskbar, Start, quick settings, notifications, lock screen
#                      and login greeter
#
# Debian 13 ships rustc and cargo 1.85; `rust-version` and resolver 3 keep
# every dependency in Cargo.lock buildable with that toolchain.
[workspace]
resolver = "3"
members = [
    "crates/boswas-ui",
    "crates/boswas-compositor",
    "crates/boswas-services",
    "crates/boswas-services-bridge",
    "crates/boswas-shell",
]

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Boswas-Internal"
authors = ["Boswas OS Platform Team"]
publish = false

[workspace.dependencies]
boswas-ui = { path = "crates/boswas-ui" }
boswas-services = { path = "crates/boswas-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = "debuginfo"
overflow-checks = true

# tiny-skia's pixel pipelines are written for builds without overflow
# checks (its own releases): with them, its sixteen-lane arithmetic is
# neither vectorised nor inlined and every blend costs several times as
# much (a translucent fill of a 2560 x 1440 screen: 40 ms). Its arithmetic
# wraps as upstream intends; bounds are still checked.
[profile.release.package.tiny-skia]
overflow-checks = false

[profile.dev]
opt-level = 1
