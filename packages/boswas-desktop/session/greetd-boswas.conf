# Boswas OS: greetd reads the Boswas login configuration.
# (Installed as /usr/lib/systemd/system/greetd.service.d/10-boswas.conf.)
[Unit]
# The boot screen hands over to the login screen, which uses the first
# virtual terminal instead of a text login.
After=boswas-bootsplash-quit.service getty@tty1.service
Conflicts=getty@tty1.service
# If greetd cannot run at all (it ends with an error and systemd gives up
# restarting it), the text login comes back on the first virtual terminal:
# an empty console with nothing to sign in on must never be the end of a
# boot. systemd runs OnFailure= at every failed attempt, so the unit named
# here waits for the outcome and starts getty@tty1 only when greetd has
# failed for good. Starting greetd again takes the terminal back (Conflicts
# above).
OnFailure=boswas-login-fallback.service

[Service]
ExecStart=
ExecStart=/usr/sbin/greetd --config /etc/boswas/greetd.toml
