# Portal back ends for the Boswas OS desktop (XDG_CURRENT_DESKTOP=Boswas).
#
# File dialogs, settings and the rest come from the GTK back end. Screen
# sharing and screenshots for sandboxed applications and browsers come from
# the wlroots back end, which asks the compositor for pictures through
# wlr-screencopy; the compositor asks the user before it gives any
# (boswas-compositor(1), SECURITY).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
