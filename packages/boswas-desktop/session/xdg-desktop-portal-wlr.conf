# xdg-desktop-portal-wlr on the Boswas OS desktop
# (/etc/xdg/xdg-desktop-portal-wlr/Boswas, read when XDG_CURRENT_DESKTOP is
# Boswas).
#
# No chooser program: the back end shares the first monitor. Whether a
# program may see the screen at all is asked by the compositor itself, for
# every program, so no separate chooser is needed for consent.
[screencast]
chooser_type=none
