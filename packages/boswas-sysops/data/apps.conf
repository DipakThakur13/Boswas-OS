# Boswas OS: device policy for software installation (boswas-sysops).
#
# Read by /usr/libexec/boswas/sysops, the privileged helper behind Boswas
# Control Center's software, update and Android pages. Format: KEY="value"
# lines, parsed without evaluation. A switch with any value other than
# "allow" counts as "deny".

# Packages installed from a local .deb file are not verified by a signed
# repository. "allow": an administrator may install them after a warning;
# "deny": only packages from the configured, signed repositories.
LOCAL_DEB="allow"

# Flatpak remotes an administrator may enable (space-separated). Each one also
# needs a definition shipped in /usr/share/boswas/sysops/flatpak-remotes/,
# which carries the remote's signing key. No remote is enabled by default.
FLATPAK_REMOTES="flathub"

# The Android runtime (Waydroid, from the Waydroid project's repository) may
# be installed by an administrator. It is never installed by default, and
# Google components are never installed.
ANDROID_RUNTIME="allow"
