# Boswas OS Android runtime facts (installed as /usr/share/boswas/android/runtime.conf).
#
# Package data, not configuration: boswas-android and boswas-sysops read these
# values; nothing else may change where the Android runtime comes from.
# Format: shell-compatible KEY="value" lines, parsed without evaluation.
# Sources and how each value was verified: docs/android/README.md.

# Waydroid's official APT repository (Waydroid is not in Debian 13). Its
# Packages index for trixie lists every architecture under binary-all.
REPO_URL="https://repo.waydro.id/"
REPO_SUITE="trixie"
REPO_COMPONENTS="main"

# Full fingerprint of the repository signing key shipped as
# /usr/share/boswas/keyrings/waydroid.gpg ("Czarek Nakamoto <ci@mrcyjanek.net>",
# rsa3072, 2023-08-03, signs the trixie InRelease).
KEY_FINGERPRINT="7CE0331F71E0A238BB1002D70E406D181DCEE19C"

# The only packages the APT pin lets through from that repository; everything
# else Waydroid needs (lxc, python3-gi, python3-dbus, iptables, ...) comes
# from Debian.
ALLOWED_PACKAGES="waydroid python3-gbinder libgbinder libglibutil"

# Android system image type requested at initialisation. VANILLA is LineageOS
# without Google applications; GAPPS is never requested (docs/android/README.md,
# "Google Play").
IMAGE_TYPE="VANILLA"

# F-Droid client (offered only on explicit request, labelled "F-Droid").
FDROID_URL="https://f-droid.org/F-Droid.apk"
FDROID_CERT_SHA256="43238d512c1e5eb2d6569f4a3afbf5523418b82e0a3ed1552770abb9a9c9ccab"
