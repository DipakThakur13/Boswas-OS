# Boswas OS boot screen (installed as
# /usr/lib/systemd/system/systemd-ask-password-console.path.d/50-boswas-bootsplash.conf).
#
# While the boot screen is up it owns the console keyboard and answers
# password requests itself (boswas-bootsplash-ask-password.service). The
# console agent would prompt on a text console hidden behind the boot screen
# and compete for the same keystrokes, so it stays off for that time, as it
# does when Plymouth is running.
[Unit]
ConditionPathExists=!/run/boswas-bootsplash/pid
