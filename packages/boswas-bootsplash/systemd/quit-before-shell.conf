# Boswas OS boot screen (installed as
# /usr/lib/systemd/system/emergency.service.d/50-boswas-bootsplash.conf and
# /usr/lib/systemd/system/rescue.service.d/50-boswas-bootsplash.conf).
#
# The emergency shell and the rescue shell talk to the user on the text
# console. A boot screen that is still up hides that console and reads its
# keyboard, so it is ended before the shell starts. systemd's own units do
# this for Plymouth ("plymouth quit"); that program does not exist on this
# system's root file system. "quit" also ends a boot screen that does not
# answer, and fails harmlessly when none is running.
[Service]
ExecStartPre=-/usr/bin/boswas-bootsplash quit
