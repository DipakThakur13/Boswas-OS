<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <title>Boswas OS boot menu background (live/installer ISO)</title>
  <!-- @BOSWAS_VERSION@ is substituted from config/boswas/release.conf by
       build/scripts/render-branding.sh. Colours: Boswas UI tokens (the boot
       screen's neutral.950, a bloom of azure.500 and iris.500 behind the mark,
       neutral.300 text, an azure.400 rule, a neutral.900 menu panel). -->
  <defs>
    <radialGradient id="boot-bloom-azure" gradientUnits="userSpaceOnUse" cx="360" cy="70" r="330">
      <stop offset="0" stop-color="#2F7FF0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2F7FF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boot-bloom-iris" gradientUnits="userSpaceOnUse" cx="470" cy="130" r="300">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#18171C"/>
  <rect width="800" height="600" fill="url(#boot-bloom-azure)"/>
  <rect width="800" height="600" fill="url(#boot-bloom-iris)"/>

  <image x="356" y="26" width="88" height="88" href="boswas-os-mark.svg"/>
  <image x="308.82" y="134" width="182.35" height="26" href="wordmark-boswas-os.svg" data-fill="#FFFFFF"/>
  <text x="400" y="194" text-anchor="middle" font-family="Inter, Lato, sans-serif" font-size="15" fill="#BDBCC6">@BOSWAS_VERSION@  ·  Live and installation medium</text>
  <rect x="376" y="212" width="48" height="3" rx="1.5" fill="#5CA3FF"/>

  <!-- Menu area (GRUB draws the boot menu from y = 49%, inside y 282-532) -->
  <rect x="100" y="282" width="600" height="250" rx="8" fill="#201F25" fill-opacity="0.72"/>
  <rect x="100.5" y="282.5" width="599" height="249" rx="7.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
