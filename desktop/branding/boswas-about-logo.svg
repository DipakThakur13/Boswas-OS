<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>Boswas OS logo tile (About this system)</title>
  <!-- Source: inlined into a self-contained SVG by build/scripts/inline-svg.py.
       The page prints the OS name next to the logo, so the tile carries the mark only.
       Colours: Boswas UI tokens (neutral.800 to neutral.950, an azure.500 glow, a white edge). -->
  <defs>
    <linearGradient id="boswas-about-tile" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="248" y2="248">
      <stop offset="0" stop-color="#2C2B32"/>
      <stop offset="1" stop-color="#18171C"/>
    </linearGradient>
    <radialGradient id="boswas-about-glow" gradientUnits="userSpaceOnUse" cx="140" cy="150" r="120">
      <stop offset="0" stop-color="#2F7FF0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2F7FF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boswas-about-edge" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="248">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#boswas-about-tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#boswas-about-glow)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" ry="51.5" fill="none" stroke="url(#boswas-about-edge)"/>
  <image x="48" y="48" width="160" height="160" href="boswas-os-mark.svg"/>
</svg>
