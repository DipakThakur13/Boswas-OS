<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>Boswas OS logo tile (System Settings - About this System)</title>
  <!-- Source: inlined into a self-contained SVG by build/scripts/inline-svg.py.
       The page prints the OS name next to the logo, so the tile carries the mark only. -->
  <defs>
    <linearGradient id="boswas-about-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162034"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <radialGradient id="boswas-about-glow" cx="128" cy="120" r="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBD693" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FBD693" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#boswas-about-tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#boswas-about-glow)"/>
  <image x="54" y="36" width="148" height="184" href="boswas-os-mark.svg"/>
</svg>
