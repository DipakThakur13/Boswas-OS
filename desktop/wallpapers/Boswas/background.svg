<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Boswas OS background (no text) - used for the login and lock screens</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090F1B"/>
      <stop offset="0.55" stop-color="#0D1727"/>
      <stop offset="1" stop-color="#112338"/>
    </linearGradient>
    <radialGradient id="glow" cx="2900" cy="1000" r="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17C6C0" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#17C6C0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#17C6C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-low" cx="500" cy="2160" r="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C4A78" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#2C4A78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <rect width="3840" height="2160" fill="url(#glow-low)"/>

  <!-- Rings radiating from the Boswas gear -->
  <g fill="none" stroke="#2ED3CD">
    <circle cx="2900" cy="1000" r="1300" stroke-opacity="0.035" stroke-width="3"/>
    <circle cx="2900" cy="1000" r="1040" stroke-opacity="0.06" stroke-width="3"/>
    <circle cx="2900" cy="1000" r="800" stroke-opacity="0.12" stroke-width="4"/>
  </g>

  <!-- Boswas Group gear symbol (traced from the official logo) -->
  <image x="2330" y="430" width="1140" height="1140" href="../../branding/boswas-symbol.svg" data-fill="#E8EEF6" opacity="0.14"/>
</svg>
