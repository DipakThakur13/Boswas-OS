<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Boswas OS background (no text) - used for the login and lock screens</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C16"/>
      <stop offset="0.55" stop-color="#0C1322"/>
      <stop offset="1" stop-color="#111A2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="2900" cy="1000" r="1500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBD693" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#FBD693" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FBD693" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-low" cx="500" cy="2160" r="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C485C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3C485C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <rect width="3840" height="2160" fill="url(#glow-low)"/>

  <!-- Rings radiating from the Boswas OS mark -->
  <g fill="none" stroke="#D4DDEC">
    <circle cx="2900" cy="1000" r="1300" stroke-opacity="0.03" stroke-width="3"/>
    <circle cx="2900" cy="1000" r="1040" stroke-opacity="0.05" stroke-width="3"/>
    <circle cx="2900" cy="1000" r="800" stroke-opacity="0.08" stroke-width="4"/>
  </g>

  <!-- The Boswas OS mark (traced from the official logo) -->
  <image x="2440" y="430" width="920" height="1140" href="../../branding/boswas-os-mark.svg" opacity="0.22"/>
</svg>
