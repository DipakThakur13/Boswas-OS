# Boswas OS release identity.
#
# Single source of truth for the OS name, version and base. Read by build.sh
# (image naming, ISO metadata, manifests) and by the boswas-os package (which
# installs it as /usr/lib/boswas/release on every device).
#
# Format: shell-compatible KEY="value" lines, no command substitution. Parsed by
# POSIX sh (build) and by Python (boswas CLI); keep it to plain assignments.

BOSWAS_NAME="Boswas OS"
BOSWAS_VERSION="v1 Alpha"
# Debian-version-compatible identifier ("~" sorts before the final release).
BOSWAS_VERSION_ID="1.0~alpha1"
# Lower-case token used in file names: Boswas-OS-v1-alpha-amd64.iso
BOSWAS_IMAGE_TAG="v1-alpha"
BOSWAS_VENDOR="Boswas Group"
# Update channel this build belongs to: dev | qa | stable
BOSWAS_CHANNEL="dev"

# Upstream base. Debian remains upstream; Boswas never replaces os-release.
BOSWAS_BASE_NAME="Debian"
BOSWAS_BASE_VERSION="13"
BOSWAS_BASE_CODENAME="trixie"
BOSWAS_ARCH="amd64"
