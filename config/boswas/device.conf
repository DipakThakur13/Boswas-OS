# Boswas device identity and enrollment state (/etc/boswas/device.conf).
#
# Written by the Boswas device agent (Milestone 2): it creates DEVICE_ID on
# first start and fills in the rest at enrollment. Until then the device is
# unenrolled and works fully offline; nothing contacts a Boswas backend.
# Contract: docs/device-management/README.md.
#
# This file must NEVER contain secrets. The device private key lives in the
# agent's credential store (root only; TPM-backed later), and enrollment
# tokens are used once and never stored. `boswas device status` only ever
# displays the keys listed below.

# Random UUID (version 4) created on the device; never derived from the
# hostname, a MAC address, a user name or a serial number.
DEVICE_ID=""
TENANT_ID=""
# https:// URL of the Boswas Control Plane.
CONTROL_PLANE_URL=""
# unenrolled | pending | enrolled | retired
ENROLLMENT_STATE="unenrolled"
POLICY_VERSION=""
# Device profile assigned by the Control Plane (e.g. "engineering").
DEVICE_PROFILE=""
# Path of the device's PUBLIC certificate issued at enrollment
# (e.g. /var/lib/boswas/agent/device.crt). Never a private key.
DEVICE_CERTIFICATE=""
