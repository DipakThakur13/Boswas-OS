# Boswas device identity and enrollment state (/etc/boswas/device.conf).
#
# Written by the Boswas device agent at enrollment (Phase 4). Until then the
# device is unenrolled and works fully offline; nothing contacts a Boswas
# backend.
#
# This file must NEVER contain secrets. Device credentials (certificate keys,
# tokens) belong in the TPM / OS secret store, not in configuration files.
# `boswas device status` only ever displays the keys listed below.

DEVICE_ID=""
TENANT_ID=""
CONTROL_PLANE_URL=""
# unenrolled | pending | enrolled | retired
ENROLLMENT_STATE="unenrolled"
POLICY_VERSION=""
