# Boswas device configuration (/etc/boswas/device.conf).
#
# Owned by the device administrator; the Boswas device agent reads it and
# never writes it. The agent's own state (device identity, enrollment,
# applied policy, credentials) lives in /var/lib/boswas/agent.
# Contract: docs/device-management/README.md.
# Check a change with:  boswas-device config validate
#
# This file must NEVER contain secrets. The device private key lives in the
# agent's credential store (root only; TPM-backed later), and enrollment
# tokens are used once and never stored. Secret-looking keys or values make
# the agent refuse the whole file.
#
# Format: NAME="value" lines, parsed without evaluation.

# --- Agent ---------------------------------------------------------------------
# yes: the agent contacts the Control Plane configured below (if any).
# no:  local functions only (identity, inventory, local API); no remote
#      contact and no remote commands.
AGENT_ENABLED="yes"
# Accept typed remote commands from the Control Plane (yes | no).
REMOTE_COMMANDS="yes"
# Optional label shown in the Control Plane (letters, digits, space . _ -).
DEVICE_NAME=""
# Device profile requested at enrollment (e.g. "engineering").
DEVICE_PROFILE=""

# --- Control Plane --------------------------------------------------------------
# Empty: a standalone device; nothing contacts a Boswas backend.
# https:// URL of the Boswas Control Plane, e.g. https://cp.boswas.example:8443
CONTROL_PLANE_URL=""
# CA certificate that signs the Control Plane's server certificate (pinned;
# required with CONTROL_PLANE_URL), e.g. /etc/boswas/control-plane-ca.pem
CONTROL_PLANE_CA=""
# Seconds between heartbeats (30-86400). A managed policy may override it.
HEARTBEAT_INTERVAL="300"

# --- Data reported to the Control Plane (docs/security/privacy.md) ----------------
# off:      nothing; minimal: OS, Boswas packages, Windows applications;
# standard: minimal plus CPU, memory, model, firmware version, disk size.
# Never: serial numbers, MAC addresses, user names, files or browsing data.
INVENTORY_POLICY="standard"
# Seconds between inventory collections (300-604800).
INVENTORY_INTERVAL="3600"
# none:     no posture reporting;
# security: posture check results (firewall: PASS, ...) and compliance state.
TELEMETRY_POLICY="security"

# --- Updates and logging -------------------------------------------------------------
# manual | security-only | managed. Only "managed" lets the Control Plane
# request an agent update (UPDATE_AGENT), and only from the signed APT sources.
UPDATE_POLICY="security-only"
# error | warning | info | debug (journal identifier boswas-device-agent).
LOG_LEVEL="info"

# --- Milestone 1 contract (still accepted) ---------------------------------------------
# Pre-provisioned device ID: set it before the agent's first start (e.g. from
# the installer preseed) to keep an ID across a reinstallation. Otherwise the
# agent creates a random UUID (version 4) on first start; it is never derived
# from the hostname, a MAC address, a user name or a serial number.
DEVICE_ID=""
TENANT_ID=""
# Informational; the agent keeps the enrollment state in /var/lib/boswas/agent.
# unenrolled | pending | enrolled | retired
ENROLLMENT_STATE="unenrolled"
POLICY_VERSION=""
# Path of a PUBLIC device certificate (e.g. /var/lib/boswas/agent/device.crt).
# Never a private key.
DEVICE_CERTIFICATE=""
