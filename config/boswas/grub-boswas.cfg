# Boswas OS boot loader defaults (installed by boswas-os as
# /etc/default/grub.d/10-boswas.cfg; read by update-grub on installed systems).

# Keep GRUB's distributor (and with it the EFI directory /EFI/debian and the
# firmware boot entry) as Debian ships it. Debian's signed shim and GRUB are
# built for that directory: renaming it would break Secure Boot. /etc/os-release
# names the system Boswas OS, which Debian's /etc/default/grub would otherwise
# copy here.
GRUB_DISTRIBUTOR="Debian"

# Boot straight into Boswas OS with the Boswas boot splash. The menu (and the
# recovery entries) appears when Esc or Shift is held during start-up.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=3
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
