# Boswas OS live session settings (installed by boswas-os as
# /etc/live/config.conf.d/boswas.conf; read by live-config only when booted
# from the live medium). The password and host name are set on the kernel
# command line (config/live-build/auto/config). So is the user name; it is
# repeated here because live-config's own default is "user", and a component
# that does not read the command line would otherwise get that name.
LIVE_USERNAME="boswas"
LIVE_USER_FULLNAME="Boswas OS Live"
