source /boot/grub/config.cfg

# Boswas OS live/installer boot menu (BIOS and UEFI).
# Overrides live-build's grub-pc/grub.cfg template; @BOSWAS_*@ placeholders are
# filled from config/boswas/release.conf when the build tree is prepared, the
# other @...@ placeholders by live-build itself.
#
# Unattended boot: after 10 seconds the live session starts.
set timeout=10

menuentry "@BOSWAS_NAME@ @BOSWAS_VERSION@ - Live session" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "@BOSWAS_NAME@ @BOSWAS_VERSION@ - Live session (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

# Installer (Debian Installer, live mode: installs this image)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities ...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the boot medium against its checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
