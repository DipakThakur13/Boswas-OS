# Boswas Control Plane configuration (/etc/boswas-control-plane/control-plane.conf).
#
# Format: KEY="value" lines, parsed without evaluation. No secrets belong
# here: keys, certificates, the database and operator token hashes live in
# DATA_DIR (0700, service user boswas-cp).
#
# First start:
#   sudo -u boswas-cp boswas-cp init --public-url https://cp.example:8443 \
#        --server-name cp.example
#   systemctl enable --now boswas-control-plane.service

# Device port: enrollment and the device API (mutual TLS).
LISTEN_ADDRESS="0.0.0.0"
LISTEN_PORT="8443"
# The https:// URL devices use, on the device port (also returned at enrollment).
PUBLIC_URL=""
# Operator port: the dashboard and the operator API (bearer tokens; no
# client-certificate request, so browsers show no certificate prompt).
# Restrict it to the administration network; empty disables it (then
# administer with boswas-cp on the server only).
OPERATOR_LISTEN_ADDRESS="0.0.0.0"
OPERATOR_LISTEN_PORT="9443"

DATA_DIR="/var/lib/boswas-control-plane"
DASHBOARD_DIR="/usr/share/boswas-control-plane/dashboard"

# Validity of device certificates issued at enrollment, in days.
DEVICE_CERT_DAYS="365"
# A device is offline after max(this, 3 x its heartbeat interval) seconds of silence.
OFFLINE_AFTER_SECONDS="180"
# Largest installer accepted by POST /api/v1/artifacts, in MiB.
MAX_UPLOAD_MB="4096"
# error | warning | info | debug
LOG_LEVEL="info"
