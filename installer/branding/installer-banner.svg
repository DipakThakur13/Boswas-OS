<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="75" viewBox="0 0 800 75">
  <title>Boswas OS installer banner (Debian Installer, graphical frontend)</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#141D2E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="75" fill="url(#bar)"/>
  <rect y="72" width="800" height="3" fill="#D9B26E"/>
  <image x="20" y="9" width="44" height="55" href="../../desktop/branding/boswas-os-mark.svg"/>
  <image x="80" y="27" width="230" height="20" preserveAspectRatio="xMinYMid"
         href="../../desktop/branding/wordmark-boswas-os.svg" data-fill="#E8EEF6"/>
  <text x="326" y="46" font-family="Lato" font-size="22" font-weight="400" fill="#EBC786">Installer</text>
</svg>
