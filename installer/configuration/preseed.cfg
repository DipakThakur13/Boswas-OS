#### Boswas OS v1 - Debian Installer defaults
#
# Loaded automatically from the installer initrd (staged there by
# build/scripts/prepare-live-config.sh). The installer runs in "live" mode:
# it copies the Boswas OS image to disk instead of downloading packages.
#
# Safety rules for this file:
#  * It sets DEFAULTS and POLICY only. It never answers destructive or
#    credential questions: disk selection, the partitioning confirmations,
#    the encryption passphrase and the administrator account are always
#    entered by the person installing.
#  * No passwords, keys or secrets may ever be added here.

### Localisation: language, location and keyboard are asked.

### Network
d-i netcfg/get_hostname string boswas-device
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/get_domain seen false

### Mirror for the installed system's APT sources (Debian upstream; the
### Boswas repository replaces it once provisioned)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/http/proxy seen false

### Accounts
# No root password: root is locked and the account created next is the local
# administrator (member of the "sudo" group). Name and password are asked.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true

### Clock
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Partitioning - policy: full-disk encryption
# Guided partitioning of a whole disk with LVM inside a LUKS2 volume
# (cryptsetup's default format). /boot and the EFI system partition stay
# unencrypted so the signed bootloader can start. The disk choice, both
# confirmations and the passphrase are asked interactively.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic

### Software
# The image already contains the complete Boswas OS package set.
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
# Update policy is owned by the boswas-security package.
d-i pkgsel/update-policy select none
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/disable-cdrom-entries boolean true
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
