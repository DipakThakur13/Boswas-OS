# Boswas WinCompat Wine runtime (installed as /usr/share/boswas/compat/runtime.conf).
#
# Package data, not configuration: these values describe the Debian Wine
# packages that boswas-compat depends on. The AppArmor profile
# (compatibility/policies/apparmor/boswas-winapp) grants exactly these
# executables, and tests/static checks that both agree.
#
# Format: shell-compatible KEY="value" lines, parsed without evaluation.

# Wine loader and server, started directly so the Debian wrapper scripts
# (which call dpkg and other tools) are not needed inside the sandbox.
WINE_LOADER="/usr/lib/wine/wine64"
WINE_SERVER="/usr/lib/wine/wineserver64"

# 32-bit Wine loader (package wine32:i386). Debian 13's 64-bit Wine contains
# only 64-bit Windows modules (no i386-windows directory, so no new-style
# WoW64); 32-bit Windows programs need Debian's wine32 from the i386
# architecture (dpkg multiarch: 32-bit libraries next to the 64-bit system,
# which stays amd64). The 64-bit loader starts this one for 32-bit programs
# (WINELOADER without its "64" suffix), inside the same win64 prefix
# (C:\Windows\SysWOW64). See docs/compatibility/README.md ("Architectures").
WINE_LOADER32="/usr/lib/wine/wine"

# Major Wine version a manifest's runtime.wineVersion must match.
WINE_MAJOR="10"

# Windows architectures this runtime can execute. "x86" counts only while
# WINE_LOADER32 is installed and executable (checked at every start).
ARCHITECTURES="x86_64 x86"

# Prefix architecture (64-bit prefix; 32-bit programs run in its SysWOW64).
WINEARCH="win64"

# Wine debug channels: quiet by default (logs stay small and contain no
# per-call traces). A manifest may override WINEDEBUG for diagnosis.
WINEDEBUG="-all"

# Always applied:
#   mscoree, mshtml       no Mono / Gecko download prompts (not shipped by Debian)
#   winemenubuilder.exe   Windows applications never create host desktop
#                         entries or MIME associations
DLL_OVERRIDES="mscoree,mshtml=;winemenubuilder.exe=d"
