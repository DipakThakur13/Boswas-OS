# Boswas WinCompat policy (/etc/boswas/compat/policy.conf).
#
# Read by boswas-winapp, and by the in-sandbox runner for REQUIRE_APPARMOR.
# Owned by root; users cannot change it. Until the Boswas policy engine
# manages this file (Milestone 4), the local administrator may edit it.
# Every change is recorded by auditd (watch on /etc/boswas/, key boswas-config).
#
# Format: KEY="value" lines, parsed without evaluation. Unknown keys are
# ignored; invalid values fall back to the most restrictive setting.
# Reference: docs/compatibility/README.md ("Policy").

# Catalog statuses that may be installed and launched (space separated).
# "blocked" is never allowed, whatever this list says.
ALLOWED_STATUSES="approved tested experimental untested unknown"

# Installers that match no catalog manifest ("unlisted", status unknown):
#   allow  installed with the UNLISTED_* sandbox below
#   deny   refused
# Production employee devices are expected to use "deny" (set by policy).
UNLISTED_APPS="allow"

# Sandbox of unlisted applications (catalog manifests declare their own).
#   UNLISTED_NETWORK  yes | no
#   UNLISTED_DEVICES  any of: display audio gpu
#   UNLISTED_FOLDERS  any of: documents downloads desktop pictures music videos
UNLISTED_NETWORK="no"
UNLISTED_DEVICES="display audio gpu"
UNLISTED_FOLDERS=""

# Refuse to run Windows code unless the boswas-winapp AppArmor profile is
# enforcing on the process (checked inside the sandbox, before Wine starts).
# "no" is only for environments without AppArmor (e.g. test containers).
REQUIRE_APPARMOR="yes"

# Largest accepted installer, in MiB.
MAX_INSTALLER_MB="4096"

# winetricks verbs manifests may request (space separated; empty: none).
# winetricks downloads third-party redistributables; each verb needs a
# licensing review before it is listed here.
WINETRICKS_ALLOWED=""
